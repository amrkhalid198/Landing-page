<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain Map — Ankle &amp; Sports Rehab</title>
<style>
:root{
  --bg:#0d1117; --bg2:#141b23; --card:#161d26; --card2:#1b232e;
  --line:#2a3541; --line2:#3a4756;
  --fg:#e8edf3; --fg2:#aab7c4; --fg3:#7d8b99;
  --accent:#4db6ff; --accent2:#7ee0c0; --warn:#ffb454; --danger:#ff7b72;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3{line-height:1.3;margin:0}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;padding:12px 16px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
h1{font-size:18px;letter-spacing:-.01em}
.counts{color:var(--fg3);font-size:12.5px;font-family:var(--mono)}
.counts b{color:var(--fg2);font-weight:600}
.searchrow{display:flex;gap:8px;margin-top:10px}
#q{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);
  color:var(--fg);padding:11px 13px;font-size:15px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,182,255,.14)}
#q::placeholder{color:var(--fg3)}
.kbd{font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--line2);
  border-radius:5px;padding:1px 5px;color:var(--fg3)}
.btn{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:0 14px;
  color:var(--fg2);white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:var(--accent);color:var(--fg)}

/* ---------- tag chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:132px;overflow-y:auto}
.chip{border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:12.5px;
  color:var(--fg2);background:var(--bg2);font-family:var(--mono);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--fg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#04121d;font-weight:600}
.chip.clear{border-color:var(--danger);color:var(--danger)}

/* ---------- layout ---------- */
.layout{max-width:1280px;margin:0 auto;padding:0 16px 80px;display:grid;
  grid-template-columns:190px minmax(0,1fr);gap:28px;align-items:start}
nav{position:sticky;top:132px;padding-top:22px}
nav a{display:block;padding:7px 11px;border-radius:8px;color:var(--fg2);font-size:13.5px;
  border-left:2px solid transparent}
nav a:hover{background:var(--card);color:var(--fg);text-decoration:none}
nav a .n{float:right;color:var(--fg3);font-family:var(--mono);font-size:11.5px}
main{padding-top:22px;min-width:0}

/* ---------- banner ---------- */
.banner{background:linear-gradient(180deg,#20180a,#1a1509);border:1px solid #5a4318;
  border-left:3px solid var(--warn);border-radius:var(--r);padding:14px 16px;margin-bottom:22px}
.banner h3{font-size:13px;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.banner p{margin:0 0 8px;color:var(--fg2);font-size:13.5px}
.banner p:last-child{margin-bottom:0}
.banner code{font-family:var(--mono);font-size:12.5px;color:var(--fg)}

/* ---------- sections ---------- */
section{margin-bottom:44px;scroll-margin-top:150px}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:6px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.sechead h2{font-size:16px;letter-spacing:-.01em}
.sechead .n{font-family:var(--mono);font-size:12px;color:var(--fg3)}
.sechead .tools{margin-left:auto;display:flex;gap:6px}
.sechead .tools button{font-size:12px;color:var(--fg3);border:1px solid var(--line);
  border-radius:6px;padding:1px 8px}
.sechead .tools button:hover{color:var(--fg);border-color:var(--line2)}
.secnote{color:var(--fg3);font-size:13px;margin:0 0 14px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;
  overflow:hidden}
.card.open{border-color:var(--line2)}
.chead{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px}
.chead:hover{background:var(--card2)}
.caret{color:var(--fg3);font-family:var(--mono);font-size:11px;line-height:1.9;flex:none;width:11px}
.card.open .caret{color:var(--accent)}
.ctitle{flex:1;min-width:0}
.ctitle .t{font-weight:600;font-size:14.5px;letter-spacing:-.005em}
.ctitle .s{color:var(--fg3);font-size:12.5px;font-family:var(--mono);margin-top:2px}
.cbody{padding:0 15px 15px 36px;border-top:1px solid var(--line)}
.cbody>*:first-child{margin-top:13px}
.cbody p{margin:0 0 11px;color:var(--fg2)}

/* ---------- bits ---------- */
.badges{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.badge{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:5px;
  border:1px solid var(--line2);color:var(--fg3);white-space:nowrap}
.badge.oa{color:var(--accent2);border-color:#2f6b57}
.badge.pay{color:var(--fg3)}
.badge.hyb{color:var(--warn);border-color:#5a4318}
.badge.ver{color:var(--fg3)}
.badge.tier-search-asserted{color:var(--danger);border-color:#6b2f2c}
.badge.tier-constructed{color:var(--warn);border-color:#5a4318}
.badge.flag{color:var(--warn);border-color:#5a4318;background:#20180a}
.tag{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--fg3);background:var(--bg2)}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.tag.on{border-color:var(--accent);color:var(--accent)}

dl.kv{margin:0 0 11px;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 14px}
dl.kv dt{color:var(--fg3);font-size:12.5px;font-family:var(--mono)}
dl.kv dd{margin:0;min-width:0;color:var(--fg2)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.links a{border:1px solid var(--line2);border-radius:7px;padding:4px 11px;font-size:13px;
  background:var(--bg2)}
.links a:hover{border-color:var(--accent);text-decoration:none;background:var(--card2)}
.links a.pri{border-color:#2f6b57;color:var(--accent2)}
.note{border-left:2px solid var(--warn);padding:2px 0 2px 11px;color:var(--fg2);
  font-size:13.5px;margin:0 0 11px}
.papers{list-style:none;margin:0 0 11px;padding:0}
.papers li{padding:7px 0;border-top:1px solid var(--line)}
.papers .py{font-family:var(--mono);font-size:12px;color:var(--fg3)}

/* ---------- search strings ---------- */
pre.ss{background:#0a0f15;border:1px solid var(--line2);border-radius:8px;padding:13px;
  overflow-x:auto;margin:0 0 10px;font-family:var(--mono);font-size:12.5px;line-height:1.75;
  color:#c9e6ff;white-space:pre-wrap;word-break:break-word}
.copybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:11px}
.copy{background:var(--accent);color:#04121d;border-radius:8px;padding:8px 18px;font-weight:700;
  font-size:14px;transition:background .12s}
.copy:hover{background:#6ac4ff}
.copy.done{background:var(--accent2)}
.runbtn{border:1px solid var(--line2);border-radius:8px;padding:8px 15px;font-size:14px;
  color:var(--accent);background:var(--bg2)}
.runbtn:hover{border-color:var(--accent);text-decoration:none}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg2);color:var(--fg2);font-size:12px;text-transform:uppercase;
  letter-spacing:.05em;font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.qt{font-weight:600;color:var(--fg)}
td code{font-family:var(--mono);font-size:12px;color:var(--accent2)}
td .rn{display:block;color:var(--fg3);font-size:12.5px;margin-top:4px;font-style:italic}

/* ---------- checklist ---------- */
.checklist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;
  color:var(--fg2);font-size:14px}
.checklist input{margin:6px 0 0;accent-color:var(--accent2);width:16px;height:16px;flex:none;cursor:pointer}
.checklist input:checked+span{color:var(--fg3);text-decoration:line-through}
.progress{font-family:var(--mono);font-size:12px;color:var(--fg3);margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}

.empty{color:var(--fg3);font-style:italic;padding:16px 0;font-size:13.5px}
footer{max-width:1280px;margin:0 auto;padding:22px 16px 50px;color:var(--fg3);font-size:12.5px;
  border-top:1px solid var(--line)}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;gap:0}
  nav{position:static;padding:14px 0 0;display:flex;gap:6px;overflow-x:auto;
    -webkit-overflow-scrolling:touch}
  nav a{border-left:none;border:1px solid var(--line2);border-radius:999px;white-space:nowrap;
    padding:5px 13px;font-size:13px}
  nav a .n{float:none;margin-left:6px}
  main{padding-top:16px}
  .cbody{padding-left:15px}
  dl.kv{grid-template-columns:1fr;gap:0 0}
  dl.kv dt{margin-top:8px}
  header{position:static}
  section{scroll-margin-top:12px}
}
</style>

/* ------------ safe localStorage ------------ */
const LS = (()=>{ try{ const k="__dm"; localStorage.setItem(k,"1"); localStorage.removeItem(k);
    return { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  }catch(e){ const m={}; return { get:(k,d)=> (k in m? m[k]:d), set:(k,v)=>{m[k]=v;} }; } })();

const state = {
  q: LS.get("dm.q",""),
  tags: new Set(LS.get("dm.tags",[])),
  open: new Set(LS.get("dm.open",[])),
  checked: new Set(LS.get("dm.checked",[]))
};
const save = ()=>{ LS.set("dm.q",state.q); LS.set("dm.tags",[...state.tags]);
  LS.set("dm.open",[...state.open]); LS.set("dm.checked",[...state.checked]); };

/* ------------ helpers ------------ */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el = (h)=>{ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const A = (href,label,cls)=> href ? `<a href="${esc(href)}" target="_blank" rel="noopener"${cls?` class="${cls}"`:""}>${esc(label)}</a>` : "";
const tagHtml = ts => (ts||[]).map(t=>`<button class="tag${state.tags.has(t)?" on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
const verBadge = o => {
  const v = o.verification || "search-confirmed";
  return `<span class="badge ver tier-${esc(v)}" title="Verification tier: ${esc(v)}">verified ${esc(o.verifiedOn)} · ${esc(v)}</span>`;
};

/* text blob used by the global search */
function blob(o){
  const parts=[];
  const walk=v=>{ if(v==null) return;
    if(typeof v==="string"||typeof v==="number") parts.push(v);
    else if(Array.isArray(v)) v.forEach(walk);
    else if(typeof v==="object") Object.values(v).forEach(walk); };
  walk(o); return parts.join(" ").toLowerCase();
}

/* ------------ matching ------------ */
function visible(o){
  if(state.tags.size){ const ts=new Set(o.tags||[]); for(const t of state.tags) if(!ts.has(t)) return false; }
  if(!state.q.trim()) return true;
  const b = o.__blob || (o.__blob = blob(o));
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>b.includes(w));
}

/* ------------ chips ------------ */
function renderChips(){
  const all=new Map();
  for(const S of SECTIONS) for(const o of (DATA[S.key]||[])) for(const t of (o.tags||[]))
    all.set(t,(all.get(t)||0)+1);
  const sorted=[...all.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
  document.getElementById("chips").innerHTML =
    (state.tags.size?`<button class="chip clear" id="cleartags">clear ${state.tags.size} tag${state.tags.size>1?"s":""} ×</button>`:"")
    + sorted.map(([t,n])=>`<button class="chip${state.tags.has(t)?" on":""}" data-tag="${esc(t)}">${esc(t)} <span style="opacity:.6">${n}</span></button>`).join("");
}

/* ------------ copy ------------ */
function copyText(txt, btn){
  const ok=()=>{ const o=btn.textContent; btn.textContent="✓ Copied"; btn.classList.add("done");
    setTimeout(()=>{ btn.textContent=o; btn.classList.remove("done"); },1400); };
  const fallback=()=>{ const ta=document.createElement("textarea"); ta.value=txt;
    ta.style.cssText="position:fixed;top:-1000px;left:-1000px"; document.body.appendChild(ta);
    ta.select(); let done=false; try{ done=document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    if(done) ok(); else { btn.textContent="Press Ctrl/Cmd+C"; setTimeout(()=>btn.textContent="Copy search string",2200); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(fallback);
  } else fallback();
}

/* ------------ events ------------ */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-toggle],[data-tag],[data-copy],[data-exp],[data-col],#cleartags");
  if(!t) return;
  if(t.hasAttribute("data-toggle")){
    const id=t.getAttribute("data-toggle"); const S=SECTIONS.find(s=>(DATA[s.key]||[]).some(o=>o.id===id));
    const wasOpen = state.open.has(id) || (S && !S.collapsed && !state.open.has("!"+id));
    if(wasOpen){ state.open.delete(id); if(S&&!S.collapsed) state.open.add("!"+id); }
    else { state.open.add(id); state.open.delete("!"+id); }
    save(); render(); return;
  }
  if(t.hasAttribute("data-tag")){
    const tag=t.getAttribute("data-tag");
    state.tags.has(tag)?state.tags.delete(tag):state.tags.add(tag);
    save(); renderChips(); render(); return;
  }
  if(t.id==="cleartags"){ state.tags.clear(); save(); renderChips(); render(); return; }
  if(t.hasAttribute("data-copy")){
    const o=DATA.searchStrings.find(s=>s.id===t.getAttribute("data-copy"));
    if(o) copyText(o.string,t); return;
  }
  if(t.hasAttribute("data-exp")||t.hasAttribute("data-col")){
    const key=t.getAttribute("data-exp")||t.getAttribute("data-col");
    const open=t.hasAttribute("data-exp");
    const S=SECTIONS.find(s=>s.key===key);
    for(const o of (DATA[key]||[])){
      if(open){ state.open.add(o.id); state.open.delete("!"+o.id); }
      else { state.open.delete(o.id); if(!S.collapsed) state.open.add("!"+o.id); }
    }
    save(); render(); return;
  }
});

document.addEventListener("change", e=>{
  const c=e.target.closest("[data-check]"); if(!c) return;
  const id=c.getAttribute("data-check");
  c.checked?state.checked.add(id):state.checked.delete(id);
  save(); render();
});

const qEl=document.getElementById("q");
qEl.value=state.q;
let tmr;
qEl.addEventListener("input",()=>{ state.q=qEl.value; clearTimeout(tmr);
  tmr=setTimeout(()=>{ save(); render(); },90); });

document.getElementById("clearall").addEventListener("click",()=>{
  state.q=""; qEl.value=""; state.tags.clear(); save(); renderChips(); render(); qEl.focus();
});

document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==qEl && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); qEl.focus(); qEl.select();
  } else if(e.key==="Escape"){
    if(state.q||state.tags.size){ state.q=""; qEl.value=""; state.tags.clear(); save(); renderChips(); render(); }
    qEl.blur();
  }
});

document.getElementById("footnote").textContent =
  DATA.meta.title+" · built "+DATA.meta.builtOn+" · data is inlined below as one JSON object with top-level keys "+
  "journals, researchers, guidelines, tools, searchStrings, routing, checklist. "+
  "Edit data.json and re-inline it — rendering is fully data-driven, adding an entry needs no code change.";

renderChips();
render();
</script>
</body>
</html>
